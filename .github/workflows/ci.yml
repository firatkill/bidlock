name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  static:
    name: lint, typecheck, unit, guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm check:guards
  database-tooling:
    name: local database tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:up
      - name: Verify PostgreSQL and pgTAP (TC-008)
        run: |
          C="docker compose -f docker/compose.yml"
          test "$($C exec -T db psql -U postgres -tAc "select count(*) from pg_database where datname in ('bidlock','bidlock_test','bidlock_load')")" = 3
          $C exec -T db which pg_prove
          test "$($C exec -T db psql -U postgres -tAc "select count(*) from pg_available_extensions where name = 'pgtap'")" = 1
      - name: Migration runner integration (TC-009–TC-013)
        run: pnpm test:concurrency
      - if: always()
        run: pnpm db:down
