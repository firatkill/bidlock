name: bidlock
services:
  db:
    build: ./postgres
    image: bidlock-postgres:17.11
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bidlock
    command:
      [
        "postgres",
        "-c",
        "max_connections=200",
        "-c",
        "shared_buffers=256MB",
        "-c",
        "log_min_duration_statement=1000",
      ]
    ports: ["54329:5432"]
    volumes:
      - ../db:/bidlock/db:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bidlock"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
